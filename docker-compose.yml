services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/devloop-password}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
  neo4j-test:
    image: neo4j:5-community
    profiles: ["test"]
    ports:
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/devloop-test-password
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p devloop-test-password 'RETURN 1'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  neo4j-data:
  neo4j-logs:
